name: Branch cleanup reminder

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  branch-cleanup-reminder:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Add cleanup reminder comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import json
          import os

          branch_name = os.environ["BRANCH_NAME"]

          body = "\n".join([
              "## Branch cleanup reminder",
              "",
              "This PR has been merged successfully.",
              "",
              "Please delete the source branch if it is no longer required.",
              "",
              f"**Source branch:** `{branch_name}`",
              "",
              "If this is a long-lived testing, environment, or validation branch, it can stay.",
              "",
              "Thanks!"
          ])

          with open("comment.json", "w", encoding="utf-8") as f:
              json.dump({"body": body}, f)
          PY

          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data @comment.json
